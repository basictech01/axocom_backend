type PublicSolution {
  id: ID!
  fullName: String!
  problemCode: String!
  solutionTitle: String!
  solutionDescription: String!
  prototypeUrl: String
  createdAt: DateTime!
  status: ReviewStatus!
}

type SolutionSubmission {
  id: ID!
  fullName: String!
  email: String!
  phone: String!
  problemCode: String!
  solutionTitle: String!
  solutionDescription: String!
  prototypeUrl: String
  contactConsentAt: DateTime!
  status: ReviewStatus!
  adminNote: String
  reviewedAt: DateTime
  reviewedByAdminId: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SolutionStatus {
  id: ID!
  problemCode: String!
  solutionTitle: String!
  status: ReviewStatus!
  reviewedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SolutionTeamMember {
  id: ID!
  fullName: String!
  email: String!
  phone: String!
  createdAt: DateTime!
}

type TeamLeaderDashboard {
  accessToken: String!
  id: ID!
  fullName: String!
  email: String!
  phone: String!
  problemCode: String!
  solutionTitle: String!
  solutionDescription: String!
  prototypeUrl: String
  status: ReviewStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
  members: [SolutionTeamMember!]!
}

type PublicSolutionConnection {
  data: [PublicSolution!]!
  pagination: Pagination!
}

type SolutionSubmissionConnection {
  data: [SolutionSubmission!]!
  pagination: Pagination!
}

type SubmitSolutionResult {
  submissionId: ID!
  status: String!
  accessToken: String!
}

input SubmitSolutionInput {
  fullName: String!
  email: String!
  phone: String!
  problemCode: String!
  solutionTitle: String!
  solutionDescription: String!
  prototypeUrl: String
  contactConsent: Boolean!
}

input UpdateReviewStatusInput {
  status: ReviewStatus!
  adminNote: String
}

input UpdateTeamSolutionInput {
  solutionTitle: String!
  solutionDescription: String!
  prototypeUrl: String
}

input SolutionTeamMemberInput {
  fullName: String!
  email: String!
  phone: String!
}

extend type Query {
  publicSolutions(problemCode: String, page: Int = 1, limit: Int = 50): PublicSolutionConnection!
  publicStats: PublicStats!
  solutionStatus(contact: String!): SolutionStatus
  teamDashboard(accessToken: String!): TeamLeaderDashboard
  adminSolutionSubmissions(
    status: ReviewStatus
    search: String
    problemCode: String
    page: Int = 1
    limit: Int = 20
  ): SolutionSubmissionConnection!
  adminSolutionSubmission(id: ID!): SolutionSubmission
}

extend type Mutation {
  submitSolution(input: SubmitSolutionInput!): SubmitSolutionResult!
  updateSolutionStatus(id: ID!, input: UpdateReviewStatusInput!): Boolean!
  "Mints a scoped dashboard access token, so this is a mutation rather than a query."
  openTeamLeaderDashboard(email: String!, phone: String!): TeamLeaderDashboard!
  updateTeamSolution(accessToken: String!, input: UpdateTeamSolutionInput!): Boolean!
  addSolutionTeamMember(accessToken: String!, input: SolutionTeamMemberInput!): SolutionTeamMember!
}
